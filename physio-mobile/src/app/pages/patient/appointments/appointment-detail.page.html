<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/patient/appointments"></ion-back-button>
    </ion-buttons>
    <ion-title>Appointment</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="loading()">
    <ion-item *ngFor="let i of [1,2,3,4]">
      <ion-label>
        <ion-skeleton-text animated style="width: 70%;"></ion-skeleton-text>
      </ion-label>
    </ion-item>
  </ion-list>

  <app-state-message
    *ngIf="!loading() && loadFailed()"
    variant="permission"
    title="Not available yet"
    message="We can't load this appointment right now. Please contact reception for details about your appointment."
  ></app-state-message>

  <ng-container *ngIf="!loading() && !loadFailed() && appointment() as appt">
    <div class="appt-status" [class]="'appt-status--' + appt.status.toLowerCase()">{{ appt.status }}</div>

    <ion-list lines="full" class="detail-list">
      <ion-item>
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Date</p>
          <h2>{{ appt.scheduledDate | date: 'EEEE, MMM d, y' }}</h2>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="time-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Time</p>
          <h2>{{ appt.scheduledTime }}<span *ngIf="appt.scheduledEndTime"> - {{ appt.scheduledEndTime }}</span></h2>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Doctor</p>
          <h2>Dr. {{ appt.doctorName }}</h2>
        </ion-label>
      </ion-item>
      <ion-item *ngIf="appt.appointmentTypeName">
        <ion-icon name="medical-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Type</p>
          <h2>{{ appt.appointmentTypeName }}</h2>
        </ion-label>
      </ion-item>
      <ion-item *ngIf="appt.chiefComplaint" lines="none">
        <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
        <ion-label class="ion-text-wrap">
          <p>Chief complaint</p>
          <h2>{{ appt.chiefComplaint }}</h2>
        </ion-label>
      </ion-item>
    </ion-list>
  </ng-container>
</ion-content>
