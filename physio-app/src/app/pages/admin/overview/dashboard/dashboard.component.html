<div
  class="pb-5 flex flex-1 min-h-0 flex-col gap-4 min-w-0"
  [attr.aria-busy]="loading"
>
  <header class="flex flex-wrap items-end justify-between gap-3">
    <div class="min-w-0">
      <h1
        class="m-0 text-xl leading-7 font-semibold tracking-tight text-regular"
      >
        Operations overview
      </h1>
      <p
        class="m-0 mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs leading-5 text-secondary"
      >
        <span>{{ updatedAt ?? today | date: "EEEE, MMM d, y" }}</span>
        <ng-container *ngIf="snapshot?.status?.shiftLabel as shift">
          <span aria-hidden="true">·</span><span>{{ shift }}</span>
        </ng-container>
        <ng-container *ngIf="updatedAt">
          <span aria-hidden="true">·</span>
          <span class="inline-flex items-center gap-1" aria-live="polite">
            <physio-icon name="clock" [size]="12" aria-hidden="true" />Updated
            {{ updatedAt | date: "HH:mm" }}
          </span>
        </ng-container>
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        boo-button
        variant="secondary"
        size="sm"
        [loading]="loading"
        (click)="loadOverview()"
      >
        <physio-icon
          *ngIf="!loading"
          name="refresh"
          [size]="15"
          aria-hidden="true"
        />Refresh
      </button>
      <button
        boo-button
        variant="primary"
        size="sm"
        [loading]="exporting"
        [disabled]="!snapshot"
        (click)="exportReport()"
      >
        <physio-icon
          *ngIf="!exporting"
          name="download"
          [size]="15"
          aria-hidden="true"
        />Export CSV
      </button>
    </div>
  </header>

  <boo-inline-error
    *ngIf="snapshot && loadError === 'failed'"
    what="the latest figures"
    [state]="refreshErrorState"
    (retry)="loadOverview()"
  />

  <div id="main-content" class="group flex flex-1 min-h-0 flex-col">
    <div class="boo-scrollbar -mr-3 flex-1 min-h-0 overflow-y-auto pr-1">
      <ng-container *ngIf="snapshot as s; else stateTpl">
        <section
          aria-label="Key figures"
          class="grid grid-cols-2 md:grid-cols-3 2xl:grid-cols-6 gap-3 mb-3"
        >
          <dashboard-kpi-tile *ngFor="let kpi of kpis" [kpi]="kpi" />
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3">
          <dashboard-patient-flow-panel
            class="lg:col-span-2"
            [flow]="s.patientFlow"
            [link]="links.admissions"
          />
          <dashboard-alerts-panel
            class="lg:col-span-2 xl:col-span-1"
            [alerts]="s.alerts"
            [canDismiss]="canDismiss"
            [dismissingIds]="dismissingIds"
            (dismiss)="confirmDismiss($event)"
          />

          <dashboard-bed-occupancy-panel
            [wards]="s.bedCapacity"
            [departments]="s.departmentLoad"
            [link]="links.beds"
          />
          <dashboard-appointments-panel
            [flow]="s.appointmentFlow"
            [link]="links.bookings"
          />
          <dashboard-activity-panel [events]="s.recentEvents" />

          <dashboard-theatres-panel
            [operations]="s.activeOperations"
            [roomsInUse]="s.status.orActive"
            [roomsTotal]="s.status.orTotal"
            [link]="links.surgery"
          />
          <dashboard-service-queues-panel
            [data]="s.financial"
            [links]="links"
          />
          <dashboard-staff-panel [staff]="s.staffDuty" />
        </div>
      </ng-container>

      <ng-template #stateTpl>
        <ng-container *ngIf="loading || !loadError; else errorTpl">
          <div class="flex flex-col gap-3" aria-hidden="true">
            <div class="grid grid-cols-2 md:grid-cols-3 2xl:grid-cols-6 gap-3">
              <div
                *ngFor="let _ of skeletonTiles"
                class="h-[118px] rounded-xl border border-borderGray bg-surface p-4"
              >
                <div class="h-3 w-24 rounded bg-rowDivider animate-pulse"></div>
                <div
                  class="mt-3 h-7 w-16 rounded bg-rowDivider animate-pulse"
                ></div>
                <div
                  class="mt-2.5 h-3 w-32 max-w-full rounded bg-rowDivider animate-pulse"
                ></div>
              </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3">
              <div
                class="lg:col-span-2 h-80 rounded-xl border border-borderGray bg-surface p-4"
              >
                <div class="h-4 w-32 rounded bg-rowDivider animate-pulse"></div>
                <div
                  class="mt-6 h-48 rounded-lg bg-rowDivider animate-pulse"
                ></div>
              </div>
              <div
                class="lg:col-span-2 xl:col-span-1 h-80 rounded-xl border border-borderGray bg-surface p-4"
              >
                <div class="h-4 w-28 rounded bg-rowDivider animate-pulse"></div>
                <div class="mt-6 flex flex-col gap-3">
                  <div
                    class="h-12 rounded-lg bg-rowDivider animate-pulse"
                  ></div>
                  <div
                    class="h-12 rounded-lg bg-rowDivider animate-pulse"
                  ></div>
                  <div
                    class="h-12 rounded-lg bg-rowDivider animate-pulse"
                  ></div>
                </div>
              </div>
            </div>
          </div>
          <span class="sr-only" role="status">Loading the dashboard…</span>
        </ng-container>
      </ng-template>

      <ng-template #errorTpl>
        <boo-empty-state
          *ngIf="loadError === 'forbidden'; else failedTpl"
          appearance="panel"
          icon="lock"
          title="You don't have access to the dashboard"
          description="Ask an administrator for the dashboard overview permission."
        />
        <ng-template #failedTpl>
          <boo-error-state
            appearance="panel"
            icon="cloud-off"
            title="We couldn't load the dashboard"
            description="Something went wrong while loading today's figures. Check your connection and try again."
            retryLabel="Try again"
            (retry)="loadOverview()"
          />
        </ng-template>
      </ng-template>
    </div>
  </div>
</div>
