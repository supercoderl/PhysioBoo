<div class="h-full flex flex-col gap-5">
  <superadmin-page-header
    title="Plans &amp; billing"
    description="Subscription plans and billing for every tenant on the platform."
  >
    <boo-button-admin
      [icon]="{ name: 'plus', size: 14 }"
      textColor="white"
      (click)="openPlan(null)"
    >
      New plan
    </boo-button-admin>
  </superadmin-page-header>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
    <ng-container *ngIf="summary() || summaryFailed(); else summaryPending">
      <boo-stat-card label="Tenants" [value]="summary()?.tenants ?? '—'" icon="ambulance" tone="primary" />
      <boo-stat-card [label]="monthlyRecurringLabel()" [value]="monthlyRecurringText()" icon="badge-check" tone="success" />
      <boo-stat-card label="Past due" [value]="summary()?.pastDue ?? '—'" icon="info" [tone]="pastDueTone()" />
      <boo-stat-card label="Outstanding invoices" [value]="outstandingText()" icon="layers" [tone]="outstandingTone()" />
    </ng-container>
    <ng-template #summaryPending>
      <div
        *ngFor="let _ of [1, 2, 3, 4]"
        class="h-[70px] rounded-2 border border-borderGray/60 bg-surface animate-pulse motion-reduce:animate-none"
        aria-hidden="true"
      ></div>
    </ng-template>
  </div>

  <div class="flex-1 min-h-0 flex flex-col">
    <superadmin-tabs
      label="Billing sections"
      [tabs]="tabs()"
      [active]="activeTab()"
      (activeChange)="onTabChange($event)"
    />

    <!-- Subscriptions -->
    <div
      *ngIf="activeTab() === 'subscriptions'"
      id="panel-subscriptions"
      role="tabpanel"
      aria-labelledby="tab-subscriptions"
      class="flex-1 min-h-[320px] pt-4"
    >
      <div *ngIf="loadFailed(); else subscriptionsTable" class="bg-surface rounded-2 border border-borderGray/60" role="alert">
        <boo-error-state
          icon="info"
          title="Couldn't load subscriptions"
          description="Check your connection and try again."
          (retry)="reload()"
        />
      </div>
      <ng-template #subscriptionsTable>
        <superadmin-subscription-table-card
          [data]="tableData()"
          [filter]="{ pageNumber: params.pageNumber, pageSize: params.pageSize }"
          [filterConfigs]="filter_configs"
          [currentFilter]="{ status: params.status || null }"
          [loading]="loading()"
          (pageChange)="onPageClick($event)"
          (searchChange)="onSearch($event)"
          (reloadClick)="reload()"
          (filterApply)="onFilterApply($event)"
          (manageClick)="openTenant($event)"
          (viewTenantClick)="viewTenant($event)"
        />
      </ng-template>
    </div>

    <!-- Plans -->
    <div
      *ngIf="activeTab() === 'plans'"
      id="panel-plans"
      role="tabpanel"
      aria-labelledby="tab-plans"
      class="flex-1 min-h-[320px] pt-4"
      custom-scrollbar
    >
      <div *ngIf="plansFailed()" class="bg-surface rounded-2 border border-borderGray/60" role="alert">
        <boo-error-state
          icon="info"
          title="Couldn't load plans"
          description="Check your connection and try again."
          (retry)="loadPlans()"
        />
      </div>

      <div
        *ngIf="!plansFailed() && plans() === null"
        class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"
        aria-busy="true"
      >
        <div
          *ngFor="let _ of [1, 2, 3]"
          class="h-[200px] rounded-2 border border-borderGray/60 bg-surface animate-pulse motion-reduce:animate-none"
        ></div>
      </div>

      <div *ngIf="plans()?.length === 0" class="bg-surface rounded-2 border border-borderGray/60" role="status">
        <boo-empty-state
          icon="badge-check"
          title="No plans yet"
          description="Create your first plan so tenants can subscribe."
        />
      </div>

      <div *ngIf="plans()?.length" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
        <article
          *ngFor="let plan of plans()"
          class="rounded-2 border bg-surface p-4 flex flex-col transition-shadow duration-200 hover:shadow-card"
          [ngClass]="plan.isActive ? 'border-borderGray/60' : 'border-dashed border-borderGray'"
        >
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-sm font-bold text-regular m-0 truncate">{{ plan.name }}</h3>
              <span class="text-[11px] font-mono text-secondary">{{ plan.code }}</span>
            </div>
            <boo-status-badge *ngIf="!plan.isActive" label="Hidden" tone="neutral" />
          </div>

          <p *ngIf="plan.description" class="text-[13px] text-secondary mt-2 mb-0 line-clamp-2">{{ plan.description }}</p>

          <div class="flex items-baseline gap-1 mt-3">
            <span class="text-2xl font-bold text-regular tabular-nums">{{ money(plan.monthlyPrice, plan.currency) }}</span>
            <span class="text-xs text-secondary">/ month</span>
          </div>

          <ul class="list-none p-0 m-0 mt-3 text-[13px] text-regular space-y-1">
            <li>{{ plan.maxUsers ?? 'Unlimited' }} users</li>
            <li>{{ plan.maxBranches ?? 'Unlimited' }} branches</li>
            <li class="text-secondary tabular-nums">{{ plan.subscriberCount }} subscribed tenant(s)</li>
          </ul>

          <div class="mt-auto pt-4">
            <button
              type="button"
              class="h-9 px-3.5 rounded-1.5 border border-borderGray bg-surface text-[13px] font-medium text-regular hover:bg-black/5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 cursor-pointer"
              [attr.aria-label]="'Edit plan ' + plan.name"
              (click)="openPlan(plan)"
            >
              Edit plan
            </button>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>

<superadmin-tenant-subscription-drawer
  [isOpen]="isTenantDrawerOpen()"
  [hospitalGroupId]="selectedTenantId()"
  [plans]="plans() ?? []"
  (close)="closeTenant()"
  (changed)="onSubscriptionChanged()"
/>

<superadmin-plan-drawer
  [isOpen]="isPlanDrawerOpen()"
  [plan]="editingPlan()"
  (close)="closePlan()"
  (saved)="onPlanSaved()"
/>
