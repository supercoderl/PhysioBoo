<div
  id=""
  class="ps bg-white relative flex flex-col flex-1 min-h-0 overscroll-contain h-screen shadow-card"
  custom-scrollbar
  style="border-top-left-radius: 12px"
>
  <div class="container">
    <div class="flex-auto p-4 md:p-6">
      <div class="flex flex-col mb-4">
        <admin-breadcrumb></admin-breadcrumb>
        <div class="flex items-center gap-2">
          <p
            class="lg:ml-0 tracking-tight font-bold leading-none text-[22px] m-0"
          >
            Account
          </p>
        </div>
      </div>
      <div class="w-full">
        <form class="flex w-full flex-col gap-8">
          <admin-account-profile 
            [userInfo]="(userInfo$ | async | defaultUser)"
          />
          <admin-account-contact />
          <admin-account-emergency />
          <ng-container *ngIf="(userInfo$ | async | defaultUser).doctor != null">
            <admin-account-doctor />
          </ng-container>
          <ng-container *ngIf="(userInfo$ | async | defaultUser).patient != null">
            <admin-account-patient />
          </ng-container>
          <div class="flex items-center justify-end gap-2">
            <boo-button-admin>Cancel</boo-button-admin>
            <boo-button-admin>Save</boo-button-admin>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
