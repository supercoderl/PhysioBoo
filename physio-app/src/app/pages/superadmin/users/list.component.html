<div class="space-y-5">
  <div class="flex items-center justify-between flex-wrap gap-3">
    <div>
      <h2 class="text-xl font-bold text-brandDark mb-0.5">Users</h2>
      <p class="text-sm text-brandDark m-0">
        All registered users across the platform
      </p>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div
      class="bg-surface rounded-xl border border-gray-200 px-4 py-3 flex items-center gap-3"
    >
      <div
        class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center shrink-0"
      >
        <physio-icon name="user" />
      </div>
      <div>
        <div class="text-lg font-bold text-brandDark leading-none">
          {{ tableData()?.totalCount ?? 0 }}
        </div>
        <div class="text-[11px] text-brandDark mt-0.5">Total Users</div>
      </div>
    </div>
    <div
      class="bg-surface rounded-xl border border-gray-200 px-4 py-3 flex items-center gap-3"
    >
      <div
        class="w-9 h-9 rounded-lg bg-green-50 flex items-center justify-center shrink-0"
      >
        <physio-icon name="circle-check" />
      </div>
      <div>
        <div class="text-lg font-bold text-brandDark leading-none">
          {{ totalActive }}
        </div>
        <div class="text-[11px] text-brandDark mt-0.5">Active</div>
      </div>
    </div>
    <div
      class="bg-surface rounded-xl border border-gray-200 px-4 py-3 flex items-center gap-3"
    >
      <div
        class="w-9 h-9 rounded-lg bg-blue-50 flex items-center justify-center shrink-0"
      >
        <boo-icon name="badge-check" />
      </div>
      <div>
        <div class="text-lg font-bold text-brandDark leading-none">
          {{ totalVerified }}
        </div>
        <div class="text-[11px] text-brandDark mt-0.5">Verified</div>
      </div>
    </div>
    <div
      class="bg-surface rounded-xl border border-gray-200 px-4 py-3 flex items-center gap-3"
    >
      <div
        class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center shrink-0"
      >
        <physio-icon name="shield-check" />
      </div>
      <div>
        <div class="text-lg font-bold text-brandDark leading-none">
          {{ (tableData()?.totalCount ?? 0) - totalActive }}
        </div>
        <div class="text-[11px] text-brandDark mt-0.5">Inactive</div>
      </div>
    </div>
  </div>

  <div class="flex-1 min-h-0">
    <superadmin-user-table-card
      [data]="tableData()"
      [filter]="{ pageNumber: params.pageNumber, pageSize: params.pageSize }"
      [sortOptions]="sort_options"
      [currentSort]="params.sort"
      [filterConfigs]="filter_configs"
      [currentFilter]="params.filter"
      (pageChange)="onPageClick($event)"
      (searchChange)="onSearch($event)"
      (editClick)="onEditUser($event)"
      (deleteClick)="onDeleteUser($event)"
      (reloadClick)="loadUsers()"
      (sortApply)="onSortChange($event)"
      (filterApply)="onFilterApply($event)"
    />
  </div>
</div>

<user-permission-user-drawer
  [isOpen]="isDrawerOpen()"
  [form]="userForm"
  [rolesData]="rolesData"
  [selectedUserId]="selectedUserId"
  [selectedUser]="selectedUser"
  [isUserRoleSelected]="isUserRoleSelected.bind(this)"
  (close)="closeDrawer()"
  (save)="saveUser()"
  (toggle)="toggleUserRole($event)"
/>
