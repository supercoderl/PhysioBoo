<div
  class="ps shadow-md bg-surface flex flex-col flex-1 min-h-0 h-screen"
  style="border-top-left-radius: 12px"
  custom-scrollbar
>
  <div class="container">
    <div class="max-w-2xl flex-auto p-4 md:p-6">
      <div class="flex flex-col mb-4">
        <admin-breadcrumb></admin-breadcrumb>
        <div class="flex items-center gap-2">
          <p class="tracking-tight font-bold leading-none text-[22px] m-0">
            Team
          </p>
        </div>
      </div>
      <div class="flex flex-col gap-4">
        <boo-input-v2 [label]="{ text: 'Add team member' }" wrapperClass="!p-0">
          <boo-icon name="user" class="leading-none" prefix></boo-icon>
          <button-icon 
          [icon]="{ name: 'circle-plus' }" 
          buttonClass="border-0 p-0"
          endfix></button-icon>
        </boo-input-v2>
        <ul class="MuiList-root MuiList-padding muiltr-g804ve"></ul>
      </div>
    </div>
  </div>
</div>
