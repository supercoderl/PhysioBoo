<section aria-labelledby="ep-h" class="bg-gray-50 border-b border-gray-200">
  <div class="max-w-[640px] mx-auto px-5 pt-12 pb-14 md:px-8 md:pt-[72px] md:pb-20 lg:px-6 lg:pt-[88px] lg:pb-24 flex flex-col gap-4 items-start text-left md:items-center md:text-center">
    <span aria-hidden="true" class="w-16 h-16 rounded-[18px] bg-surface border border-gray-200 flex items-center justify-center mb-1" [style.color]="content.tone">
      <physio-icon [name]="content.icon" [size]="28" />
    </span>
    <span class="text-[13px] font-semibold tracking-[.08em] text-gray-700">{{ content.eyebrow }}</span>
    <h1 id="ep-h" class="text-[30px] leading-[38px] md:text-[38px] md:leading-[46px] lg:text-[44px] lg:leading-[52px] font-semibold tracking-[-0.02em] text-gray-900 m-0 text-balance">
      {{ content.title }}
    </h1>
    <p class="text-base leading-[25px] md:text-lg md:leading-7 text-gray-800 m-0 max-w-[520px] text-pretty">{{ content.desc }}</p>

    <p *ngIf="content.hint as hint" class="text-sm leading-[21px] text-gray-700 m-0 max-w-[500px] flex gap-2 items-start text-left">
      <physio-icon [name]="hint.icon" [size]="14" class="mt-[3px] flex-none" aria-hidden="true" />
      <span>{{ hint.text }}</span>
    </p>

    <!-- Retry failed: keep the button so the visitor can try again later -->
    <div *ngIf="content.retry && state === 'failed'" role="alert" class="w-full max-w-[520px] border border-[#F0D49B] bg-[#FFFBF2] rounded-xl px-4 py-3.5 flex gap-2.5 items-start text-left">
      <physio-icon name="info" [size]="16" class="text-[#8A5300] mt-[3px] flex-none" aria-hidden="true" />
      <div>
        <p class="m-0 text-[15px] font-semibold text-gray-900">{{ content.retry.failTitle }}</p>
        <p class="mt-0.5 mb-0 text-sm leading-[21px] text-gray-800">
          {{ content.retry.failBody }}
          <a routerLink="/contact" class="text-primaryDeep underline font-medium hover:text-primaryDeep">Contact us</a> if you need help.
        </p>
      </div>
    </div>
    <p role="status" aria-live="polite" class="sr-only">{{ busy ? 'Trying again' : '' }}</p>

    <div class="flex gap-2.5 flex-wrap mt-2 w-full md:w-auto justify-start md:justify-center">
      <ng-container *ngIf="content.retry; else homePrimary">
        <button boo-button variant="primary" size="lg" (click)="retry()" [loading]="busy" class="flex-[1_1_100%] md:flex-none">
          <physio-icon *ngIf="!busy" name="rotate-cw" [size]="18" />
          {{ busy ? 'Trying again…' : 'Try again' }}
        </button>
        <a boo-button variant="secondary" size="lg" [routerLink]="homeLink" class="flex-[1_1_100%] md:flex-none">
          Back to homepage
        </a>
      </ng-container>
      <ng-template #homePrimary>
        <a boo-button variant="primary" size="lg" [routerLink]="homeLink" class="flex-[1_1_100%] md:flex-none">
          <physio-icon name="house" [size]="18" aria-hidden="true" />Back to homepage
        </a>
      </ng-template>
      <a boo-button variant="secondary" size="lg" *ngIf="content.contact" routerLink="/contact" class="flex-[1_1_100%] md:flex-none">
        Contact us
      </a>
    </div>

    <nav *ngIf="content.links" aria-label="Popular pages" class="w-full mt-4 pt-6 border-t border-gray-200 flex flex-col gap-3 items-stretch">
      <span class="text-sm font-medium text-gray-700">Or go straight to</span>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
        <a routerLink="/doctor" class="min-h-14 px-4 border border-gray-200 rounded-[14px] bg-surface flex gap-3 items-center text-[15px] font-semibold text-gray-900 hover:border-[#E3C4CE] hover:text-primaryDeep">
          <physio-icon name="stethoscope" [size]="18" class="text-primaryDeep" aria-hidden="true" />
          <span class="flex-1">Find a doctor</span>
          <physio-icon name="chevron-right" [size]="16" class="text-gray-600" aria-hidden="true" />
        </a>
        <a routerLink="/hospitals" class="min-h-14 px-4 border border-gray-200 rounded-[14px] bg-surface flex gap-3 items-center text-[15px] font-semibold text-gray-900 hover:border-[#E3C4CE] hover:text-primaryDeep">
          <physio-icon name="building-2" [size]="18" class="text-primaryDeep" aria-hidden="true" />
          <span class="flex-1">Explore clinics</span>
          <physio-icon name="chevron-right" [size]="16" class="text-gray-600" aria-hidden="true" />
        </a>
      </div>
    </nav>
  </div>
</section>
