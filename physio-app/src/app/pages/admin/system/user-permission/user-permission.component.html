<admin-content-header>
  <!-- Page hero -->
  <div
    class="flex items-start justify-between pb-4 mb-3 border-b border-gray-200"
  >
    <div>
      <h4 class="text-[22px] text-primary font-semibold mb-1">
        User & Permission Management
      </h4>
      <p class="text-sm text-secondary m-0">
        Control who can sign in, what they can do, and which permissions roll up
        into each role.
      </p>
    </div>
    <div class="hidden md:flex items-center gap-2">
      <div
        class="px-3 py-2 rounded-lg bg-surface border border-gray-200 flex items-center gap-2"
      >
        <boo-icon name="users" iconClass="w-4 h-4 text-primary"></boo-icon>
        <span class="text-xs text-secondary uppercase tracking-wider"
          >Users</span
        >
        <span class="text-sm font-semibold text-primary">{{
          statUsers()
        }}</span>
      </div>
      <div
        class="px-3 py-2 rounded-lg bg-surface border border-gray-200 flex items-center gap-2"
      >
        <boo-icon name="shield" iconClass="w-4 h-4 text-primary"></boo-icon>
        <span class="text-xs text-secondary uppercase tracking-wider"
          >Roles</span
        >
        <span class="text-sm font-semibold text-primary">{{
          statRoles()
        }}</span>
      </div>
      <div
        class="px-3 py-2 rounded-lg bg-surface border border-gray-200 flex items-center gap-2"
      >
        <boo-icon name="key" iconClass="w-4 h-4 text-primary"></boo-icon>
        <span class="text-xs text-secondary uppercase tracking-wider"
          >Permissions</span
        >
        <span class="text-sm font-semibold text-primary">{{
          statPermissions()
        }}</span>
      </div>
    </div>
  </div>

  <!-- Tab nav -->
  <div class="flex items-center gap-1 mb-4 p-1 bg-gray-100 rounded-lg w-fit">
    <button
      *ngFor="let t of tabs"
      type="button"
      (click)="setTab(t.key)"
      class="px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-all"
      [ngClass]="
        activeTab() === t.key
          ? 'bg-surface text-primary shadow-sm'
          : 'text-secondary hover:text-primary'
      "
    >
      <boo-icon [name]="t.icon" iconClass="w-4 h-4"></boo-icon>
      {{ t.label }}
    </button>
  </div>

  <!-- ============================================================== -->
  <!-- Users tab                                                      -->
  <!-- ============================================================== -->
  <div *ngIf="activeTab() === 'users'" class="space-y-4">
    <div
      class="p-3 flex justify-between md:items-center"
    >
      <button
        (click)="openNewUser()"
        class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-md hover:opacity-90 flex items-center gap-2 whitespace-nowrap"
      >
        <boo-icon name="user-plus" iconClass="w-4 h-4"></boo-icon>
        New User
      </button>
    </div>

    <admin-user-permission-user-tab
      [tableData]="usersData"
      [params]="userParams"
      (reloadClick)="loadUsers()"
    />
  </div>

  <!-- ============================================================== -->
  <!-- Roles tab                                                       -->
  <!-- ============================================================== -->
  <div *ngIf="activeTab() === 'roles'" class="space-y-4">
    <div
      class="p-3 flex justify-between md:items-center"
    >
      <button
        (click)="openNewRole()"
        class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-md hover:opacity-90 flex items-center gap-2 whitespace-nowrap"
      >
        <boo-icon name="plus" iconClass="w-4 h-4"></boo-icon>
        New Role
      </button>
    </div>

    <admin-user-permission-role-tab
      [tableData]="rolesData"
      (editClick)="openEditRole($event)"
      (newClick)="openNewRole()"
    />
  </div>

  <!-- ============================================================== -->
  <!-- Permissions tab                                                 -->
  <!-- ============================================================== -->
  <div *ngIf="activeTab() === 'permissions'" class="space-y-4">
    <!-- Toolbar -->
    <div
      class="p-3 flex justify-between md:items-center"
    >
      <button
        (click)="openNewPermission()"
        class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-md hover:opacity-90 flex items-center gap-2 whitespace-nowrap"
      >
        <boo-icon name="plus" iconClass="w-4 h-4"></boo-icon>
        New Permission
      </button>
    </div>

    <admin-user-permission-permission-tab
      [permissionGroups]="permissionGroups"
      (editClick)="openEditPermission($event)"
      (deleteClick)="deletePermission($event)"
    />
  </div>

  <!-- ============================================================== -->
  <!-- User drawer (create / edit + role assignment)                   -->
  <!-- ============================================================== -->
  <user-permission-user-drawer
    [isOpen]="isUserDrawerOpen()"
    (close)="closeUserDrawer()"
    (save)="saveUser()" 
    [form]="userForm" 
    [rolesData]="rolesData" 
    [selectedUserId]="selectedUserId" 
    [selectedUser]="selectedUser" 
    [isUserRoleSelected]="isUserRoleSelected"
  />

  <!-- ============================================================== -->
  <!-- Role drawer (create / edit + permission matrix)                 -->
  <!-- ============================================================== -->
  <user-permission-role-drawer
    [isOpen]="isRoleDrawerOpen()"
    (close)="closeRoleDrawer()"
    (saveRole)="saveRole()"
    (deleteRole)="deleteRole($event)"
    [form]="roleForm"
    [selectedRoleId]="selectedRoleId"
    [selectedRole]="selectedRole" 
    [rolePermissionsDraft]="rolePermissionsDraft" 
    [permissionsData]="permissionsData" 
    [permissionCategories]="permissionCategories" 
    [permsByCategory]="permsByCategory" 
    [isPermSelected]="isPermSelected" 
    [categoryAllSelected]="categoryAllSelected"
  />

  <!-- ============================================================== -->
  <!-- Permission drawer (create / edit)                               -->
  <!-- ============================================================== -->
  <user-permission-permission-drawer
    [isOpen]="isPermDrawerOpen()"
    (close)="closePermDrawer()"
    (savePermission)="savePermission()"
    [form]="permForm"
    [selectedPermissionId]="selectedPermissionId"
  />
</admin-content-header>
