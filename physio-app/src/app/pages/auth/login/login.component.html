<div class="bg-white">
  <div
    class="py-20 md:py-15 flex md:items-center h-screen overflow-y-auto flex-wrap relative"
  >
    <div
      class="bg-center bg-cover absolute top-0 left-0 right-0 w-full h-[380px]"
      style="
        background-image: url(https://themesbrand.com/velzon/html/master/assets/images/auth-one-bg.jpg);
      "
    >
      <div
        class="opacity-90 absolute inset-0 w-full h-full"
        style="background: linear-gradient(to right, #364574, #405189)"
      ></div>
      <div class="absolute bottom-0 right-0 left-0 z-[1]">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          version="1.1"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 0 1440 120"
          class="w-full h-auto fill-white"
        >
          <path
            d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"
          ></path>
        </svg>
      </div>
      <canvas
        repulse-particles
        [number]="100"
        [showLinks]="false"
        class="particles-js-canvas-el w-full h-full relative z-[1]"
      ></canvas>
    </div>
    <div class="container mx-auto">
      <div class="flex-center-center relative">
        <div class="text-center mb-6 text-[rgba(255,_255,_255,_0.5)]">
          <div>
            <a href="index.html" class="inline-block">
              <img
                src="../../../../assets/logo/logo-white.webp"
                alt=""
                class="w-1/2 mx-auto h-auto object-cover"
              />
            </a>
          </div>
          <p class="text-[15px] font-medium my-4">
            Digital Solutions for Clinics & Hospitals
          </p>
        </div>
      </div>
      <div class="flex justify-center w-full">
        <div
          class="w-full relative bg-white shadow-lg p-5 rounded-2.5 md:w-1/3"
        >
          <div class="relative">
            <div class="relative z-[1]">
              <div class="mb-5">
                <h3
                  class="text-[32px] mb-2 font-semibold text-primary leading-[1.2] text-center"
                >
                  Welcome Back!
                </h3>
                <p class="mb-2.5 text-xs15 text-brandDark text-center">
                  Log in to continue to Physio Boo.
                </p>
              </div>
              <form boo-form [formGroup]="form" (validSubmit)="login($event)">
                <span class="text-primary inline-block mb-3">
                  Log in with
                  <a
                    class="text-secondary font-medium cursor-pointer transition-smooth"
                    (click)="
                      onChangeState(state === 'phone' ? 'email' : 'phone')
                    "
                  >
                    {{ state === "phone" ? "Email" : "Phone Number" }}
                  </a>
                </span>
                <div class="mb-4">
                  <label
                    class="text-xs14 font-medium text-primary mb-1 inline-block"
                    >{{ state === "phone" ? "Phone number" : "E-mail" }}</label
                  >
                  <boo-input
                    [label]="
                      'Input your ' +
                      (state === 'phone' ? 'phone number' : 'e-mail')
                    "
                    formControlName="email"
                    [required]="true"
                    booError
                  />
                </div>
                <div class="mb-4">
                  <div class="flex-center-between">
                    <label
                      class="text-xs14 font-medium text-primary mb-1 inline-block"
                      >Password</label
                    >
                    <a
                      class="font-medium text-secondary mb-1 inline-block text-xs14 cursor-pointer"
                      routerLink="/auth/forgot"
                    >
                      Forgot password?
                    </a>
                  </div>
                  <div class="relative">
                    <boo-input
                      label="Input your password"
                      formControlName="password"
                      [required]="true"
                      [type]="type"
                      booError
                    >
                      <boo-icon
                        [name]="type === 'text' ? 'eye' : 'eye-off'"
                        class="leading-none absolute top-1/2 -translate-y-1/2 right-2.5 stroke-brandDark cursor-pointer"
                        endfix
                        (click)="onChangeType()"
                      ></boo-icon>
                    </boo-input>
                  </div>
                </div>
                <div class="mb-4">
                  <div class="flex-center-between">
                    <div class="block pl-6">
                      <input
                        class="bg-secondary border-secondary border border-solid rounded-[0.25rem] float-left -ml-6 mt-1 w-3.6 h-3.6"
                        id="remember"
                        type="checkbox"
                        checked=""
                      />
                      <label class="text-xs14 inline-block" for="remember">
                        Remember Me
                      </label>
                    </div>
                    <div class="block pl-6">
                      <input
                        class="bg-secondary border-secondary border border-solid rounded-[0.25rem] float-left -ml-6 mt-1 w-3.6 h-3.6"
                        id="remember1"
                        type="checkbox"
                      />
                      <label class="text-xs14 inline-block" for="remember1">
                        Login with OTP
                      </label>
                    </div>
                  </div>
                </div>
                <div class="mb-4">
                  <button
                    boo-button
                    label="Login"
                    classname="!w-full !py-3 font-bold uppercase"
                    [radius]="5"
                    [loading]="loadingSrv.isLoading('login')"
                  ></button>
                </div>
                <div class="text-base my-4 py-2.5 relative">
                  <span class="bg-borderGray h-[1px] block"></span>
                  <span
                    class="bg-white block absolute top-[-3px] left-1/2 -ml-5 text-center w-10.5"
                    >or</span
                  >
                </div>
                <div>
                  <a
                    boo-button
                    background="white"
                    classname="!w-full !py-3 font-bold uppercase !border border-borderGray !text-primary"
                    [radius]="5"
                  >
                    <img
                      alt="google-icon"
                      src="https://doccure.dreamstechnologies.com/react/template/src/assets/img/icons/google-icon.svg"
                      class="mr-2"
                    />
                    Log in With Google
                  </a>
                  <a
                    boo-button
                    background="white"
                    classname="!w-full !py-3 font-bold mt-3 uppercase !border border-borderGray !text-primary"
                    [radius]="5"
                  >
                    <img
                      alt="fb-icon"
                      src="https://doccure.dreamstechnologies.com/react/template/src/assets/img/icons/facebook-icon.svg"
                      class="mr-2"
                    />
                    Log in With Facebook
                  </a>
                </div>
                <div class="text-center mt-10">
                  <p class="m-0 text-xs15 text-brandDark">
                    Don't have an account ?
                    <a
                      href="/auth/register"
                      class="font-medium text-secondary cursor-pointer transition-smooth"
                    >
                      Register
                    </a>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
