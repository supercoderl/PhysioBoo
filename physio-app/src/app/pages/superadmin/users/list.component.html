<div class="h-full flex flex-col gap-5">
  <superadmin-page-header
    title="Users"
    description="All registered accounts across the platform."
  />

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <ng-container *ngIf="stats() || statsFailed(); else statsPending">
      <boo-stat-card
        label="Total users"
        [value]="stats()?.total ?? '—'"
        icon="user"
        tone="primary"
      />
      <boo-stat-card
        label="Active"
        [value]="stats()?.active ?? '—'"
        icon="circle-check"
        tone="success"
      />
      <boo-stat-card
        label="Inactive"
        [value]="stats()?.inactive ?? '—'"
        icon="shield-check"
        tone="neutral"
      />
    </ng-container>
    <ng-template #statsPending>
      <div
        *ngFor="let _ of [1, 2, 3]"
        class="h-[70px] rounded-2 border border-borderGray/60 bg-surface animate-pulse motion-reduce:animate-none"
        aria-hidden="true"
      ></div>
    </ng-template>
  </div>

  <div class="flex-1 min-h-[320px]">
    <superadmin-user-table-card
      [data]="tableData()"
      [filter]="{ pageNumber: params.pageNumber, pageSize: params.pageSize }"
      [sortOptions]="sort_options"
      [currentSort]="params.sort"
      [filterConfigs]="filter_configs"
      [currentFilter]="params.filter"
      (pageChange)="onPageClick($event)"
      (searchChange)="onSearch($event)"
      (editClick)="onEditUser($event)"
      (deleteClick)="onDeleteUser($event)"
      (reloadClick)="loadUsers()"
      (sortApply)="onSortChange($event)"
      (filterApply)="onFilterApply($event)"
    />
  </div>
</div>

<user-permission-user-drawer
  [isOpen]="isDrawerOpen()"
  [form]="userForm"
  [rolesData]="rolesData"
  [selectedUserId]="selectedUserId"
  [selectedUser]="selectedUser"
  [isUserRoleSelected]="isUserRoleSelected.bind(this)"
  (close)="closeDrawer()"
  (save)="saveUser()"
  (toggle)="toggleUserRole($event)"
/>
