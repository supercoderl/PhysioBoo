<div class="relative z-10 flex min-h-0 flex-auto flex-col">
  <div class="container flex shrink-0 grow flex-col items-center p-4">
    <div class="flex flex-col">
      <admin-breadcrumb></admin-breadcrumb>
      <p class="tracking-tight font-extrabold leading-none text-[22px] text-center m-0">
        Scrumboard Boards
      </p>
    </div>

    <!-- Loading skeleton -->
    <div *ngIf="isLoading()" class="mt-8 grid w-full grid-cols-1 gap-4 sm:grid-cols-2 md:mt-12 md:gap-6 lg:grid-cols-4" aria-busy="true">
      <div *ngFor="let i of [1, 2, 3, 4]" class="min-h-60 animate-pulse rounded-lg bg-surface p-6 shadow-sm">
        <div class="h-12 w-12 rounded-full bg-gray-200"></div>
        <div class="mt-5 h-4 w-2/3 rounded bg-gray-200"></div>
        <div class="mt-3 h-3 w-full rounded bg-gray-100"></div>
      </div>
    </div>

    <div *ngIf="!isLoading()" class="mt-8 grid w-full grid-cols-1 gap-4 sm:grid-cols-2 md:mt-12 md:gap-6 lg:grid-cols-4">
      <a
        *ngFor="let board of boards(); trackBy: trackById"
        [routerLink]="['/admin/system/scrumboard/board', board.id]"
        class="min-h-60 md:p-6 transition-shadow duration-150 ease-in-out shadow-sm hover:shadow-md p-4 rounded-lg flex flex-col w-full h-full bg-surface text-[#1F232B] no-underline focus:outline-none focus:ring-2 focus:ring-primary"
      >
        <div class="flex w-full flex-auto flex-col items-start justify-start">
          <div class="p-4 rounded-full flex-center-center bg-primary/20 text-primary">
            <boo-icon name="blocks"></boo-icon>
          </div>
          <p class="font-medium leading-5 text-[14px] mt-5 m-0">{{ board.title }}</p>
          <p *ngIf="board.description" class="line-clamp-2 mt-0.5 m-0 text-[13px] leading-[1.5]">{{ board.description }}</p>
          <hr class="w-12 h-0.5 mt-6 m-0 shrink-0 border-[0_0_thin] border-solid border-[#E5E7EB]" />
        </div>
        <div class="flex w-full flex-auto flex-col items-start justify-end">
          <p class="m-0 mt-4 text-[13px] leading-[1.5] text-[#4B5563]">
            {{ board.listCount }} {{ board.listCount === 1 ? 'list' : 'lists' }} · {{ board.cardCount }} {{ board.cardCount === 1 ? 'card' : 'cards' }}
          </p>
          <div class="mt-2 flex items-center text-[13px] leading-[1.5]">
            <span class="text-[#4B5563]">Edited:</span>
            <span class="truncate mx-1">{{ board.updatedAt | date:'MMM d, y, h:mm a' }}</span>
          </div>
        </div>
      </a>

      <button
        type="button"
        (click)="openDialog()"
        class="min-h-60 flex flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-[#E5E7EB] bg-transparent p-4 text-[#4B5563] hover:border-primary hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary"
      >
        <boo-icon name="plus" [size]="28"></boo-icon>
        <span class="text-[14px] font-medium">New board</span>
      </button>
    </div>

    <div *ngIf="!isLoading() && !boards().length" class="mt-6 w-full">
      <boo-empty-state icon="blocks" title="No boards yet" description="Create the first board to start organising work."></boo-empty-state>
    </div>
  </div>
</div>

<!-- New board dialog -->
<div *ngIf="draft() as d" class="fixed inset-0 z-40 flex items-center justify-center bg-black/40 p-4" (click)="closeDialog()">
  <div
    role="dialog"
    aria-modal="true"
    aria-label="New board"
    class="w-full max-w-md rounded-xl bg-surface shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <div class="border-b border-[#E5E7EB] px-4 py-3">
      <h2 class="m-0 text-[16px] font-semibold">New board</h2>
    </div>
    <div class="space-y-3 px-4 py-3">
      <label class="block">
        <span class="mb-1 block text-[12px] font-semibold text-[#4B5563]">Title</span>
        <input
          type="text"
          [(ngModel)]="d.title"
          (keydown.enter)="createBoard()"
          maxlength="120"
          autofocus
          class="w-full rounded-lg border border-[#E5E7EB] px-3 min-h-10 text-[14px] outline-none focus:border-primary"
        />
      </label>
      <label class="block">
        <span class="mb-1 block text-[12px] font-semibold text-[#4B5563]">Description</span>
        <textarea
          [(ngModel)]="d.description"
          maxlength="500"
          rows="3"
          class="w-full rounded-lg border border-[#E5E7EB] px-3 py-2 text-[14px] outline-none focus:border-primary"
        ></textarea>
      </label>
    </div>
    <div class="flex justify-end gap-2 border-t border-[#E5E7EB] px-4 py-3">
      <button type="button" (click)="closeDialog()" class="rounded-lg px-3 min-h-10 text-[13px] font-medium text-[#4B5563] hover:bg-gray-100">Cancel</button>
      <button
        type="button"
        (click)="createBoard()"
        [disabled]="!canCreate()"
        class="rounded-lg bg-primary px-4 min-h-10 text-[13px] font-medium text-white disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isSaving() ? 'Creating...' : 'Create' }}
      </button>
    </div>
  </div>
</div>
