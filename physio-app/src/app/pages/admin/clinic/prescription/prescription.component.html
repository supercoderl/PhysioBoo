<div class="flex-1 flex flex-col gap-4 min-w-0 pb-5">
  <ng-container *ngIf="mode === 'empty'">
    <rx-action-bar
      title="Prescription"
      subtitle="Outpatient prescriptions"
      [showRefresh]="false"
    />
    <div class="bg-surface border border-borderGray rounded-xl flex-1">
      <boo-empty-state
        icon="file-text"
        title="No prescription selected"
        description="Open a prescription from a patient's record. This page needs a prescription or a patient to show."
      />
    </div>
  </ng-container>

  <ng-container *ngIf="mode === 'patient'">
    <rx-action-bar
      title="Patient prescriptions"
      subtitle="Choose a prescription to view or edit"
      [showRefresh]="false"
    />

    <div
      *ngIf="loading()"
      class="h-48 rounded-xl bg-surface border border-borderGray animate-pulse"
      role="status"
      aria-busy="true"
      aria-label="Loading prescriptions"
    ></div>

    <div
      *ngIf="!loading() && loadError() as err"
      class="bg-surface border border-borderGray rounded-xl flex-1"
    >
      <boo-error-state
        icon="triangle-alert"
        [title]="
          err === 'forbidden'
            ? 'No access to prescriptions'
            : err === 'notFound'
              ? 'Patient not found'
              : 'Could not load prescriptions'
        "
        [description]="
          err === 'forbidden'
            ? 'Your account is not allowed to view prescriptions of this patient.'
            : err === 'notFound'
              ? 'The link does not point to a patient.'
              : 'Something went wrong while loading. Try again.'
        "
        [showRetry]="err === 'failed'"
        (retry)="retry()"
      />
    </div>

    <rx-patient-list
      *ngIf="!loading() && !loadError()"
      [rows]="patientRows()"
      (open)="openPrescription($event)"
    />
  </ng-container>

  <ng-container *ngIf="mode === 'detail'">
    <div
      *ngIf="loading() && !prescription()"
      class="flex flex-col gap-4"
      role="status"
      aria-busy="true"
      aria-label="Loading prescription"
    >
      <div
        class="h-8 w-64 rounded-lg bg-surface border border-borderGray animate-pulse"
      ></div>
      <div
        class="h-24 rounded-xl bg-surface border border-borderGray animate-pulse"
      ></div>
      <div
        class="h-40 rounded-xl bg-surface border border-borderGray animate-pulse"
      ></div>
      <div
        class="h-64 rounded-xl bg-surface border border-borderGray animate-pulse"
      ></div>
    </div>

    <div
      *ngIf="!loading() && !prescription() && loadError() as err"
      class="bg-surface border border-borderGray rounded-xl flex-1"
    >
      <boo-error-state
        icon="triangle-alert"
        [title]="
          err === 'forbidden'
            ? 'No access to this prescription'
            : err === 'notFound'
              ? 'Prescription not found'
              : 'Could not load the prescription'
        "
        [description]="
          err === 'forbidden'
            ? 'Your account is not allowed to view prescriptions.'
            : err === 'notFound'
              ? 'It may have been removed, or the link is wrong.'
              : 'Something went wrong while loading. Try again.'
        "
        [showRetry]="err === 'failed'"
        (retry)="retry()"
      />
    </div>

    <ng-container *ngIf="prescription() as rx">
      <rx-action-bar
        [title]="'Prescription ' + rx.prescriptionNumber"
        [status]="status()"
        [dirty]="dirty"
        [loading]="loading()"
        (refresh)="refresh()"
      />

      <div *ngIf="canListPatientRx()">
        <button
          type="button"
          boo-button
          variant="link"
          size="sm"
          (click)="backToPatient()"
        >
          <physio-icon name="arrow-left" [size]="15" aria-hidden="true" />All
          prescriptions of this patient
        </button>
      </div>

      <boo-inline-error
        *ngIf="loadError() && !loading()"
        what="the latest version of this prescription"
        (retry)="refresh()"
      />

      <p
        *ngIf="status() === 'Draft' && !canUpdate()"
        class="m-0 rounded-lg bg-gray-50 border border-borderGray px-4 py-2.5 text-xs text-secondary"
        role="status"
      >
        You can view this draft but your account cannot edit it.
      </p>

      <rx-patient-summary [prescription]="rx" />

      <rx-details-form [form]="form" [editable]="editable()" />

      <rx-medication-table
        [lines]="lines()"
        [editable]="editable()"
        [checking]="busy() === 'check'"
        (add)="openAdd()"
        (edit)="openEdit($event)"
        (remove)="removeLine($event)"
        (check)="checkWarnings()"
      />

      <rx-footer
        *ngIf="editable() || showIssue() || showCancel()"
        [total]="linesTotal()"
        [canEdit]="editable()"
        [canIssue]="showIssue()"
        [canCancel]="showCancel()"
        [dirty]="dirty"
        [saving]="busy() === 'save'"
        [issuing]="busy() === 'issue'"
        [busy]="!!busy() || loading()"
        [issueBlockedReason]="issueBlockedReason()"
        (save)="save()"
        (issue)="confirmIssue()"
        (cancel)="openCancel()"
      />
    </ng-container>
  </ng-container>
</div>

<rx-medication-drawer
  [isOpen]="drawerOpen"
  [line]="editingLine"
  [canSearch]="canSearchMedicines()"
  [existingMedicineIds]="existingMedicineIds()"
  (close)="closeDrawer()"
  (saved)="onItemSaved($event)"
/>

<rx-cancel-drawer
  [isOpen]="cancelOpen"
  [prescriptionNumber]="prescription()?.prescriptionNumber ?? ''"
  [submitting]="busy() === 'cancel'"
  (close)="closeCancel()"
  (confirmed)="cancelPrescription($event)"
/>
