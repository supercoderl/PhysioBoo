<div class="flex h-full flex-col p-4 relative min-h-full">
  <div class="flex flex-auto flex-col">
    <div class="mb-8 flex items-end justify-between pt-34">
      <p class="font-bold leading-none text-2xl m-0">Notifications</p>
    </div>
    <!-- There is no notification feed API yet, so nothing is listed rather than sample data. -->
    <div
      role="status"
      class="flex flex-col items-center justify-center gap-3 rounded-xl bg-gray-100 px-6 py-12 text-center"
    >
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-gray-200">
        <physio-icon name="bell" [size]="22" [class]="'shrink-0 opacity-75'" />
      </div>
      <p class="m-0 font-semibold text-[13px] leading-[1.5]">You're all caught up</p>
      <p class="m-0 max-w-xs text-[13px] leading-[1.4] text-secondary">
        New notifications will appear here.
      </p>
      <a
        routerLink="/admin/system/settings/notification"
        class="text-[13px] text-primary underline"
      >
        Notification settings
      </a>
    </div>
  </div>
</div>
