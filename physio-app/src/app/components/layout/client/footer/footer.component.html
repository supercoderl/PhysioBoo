<footer class="border-t border-gray-200 bg-gray-50">
  <div class="max-w-[1200px] mx-auto px-5 xl:px-0 pt-10 pb-8 md:pt-16">
    <div class="grid grid-cols-2 gap-x-4 gap-y-7 md:grid-cols-[minmax(0,1.6fr)_repeat(3,minmax(0,1fr))] md:gap-12 pb-7 md:pb-12 border-b border-gray-200">
      <div class="col-span-2 md:col-span-1">
        <img src="assets/logo/logo.webp" [alt]="tenant.name" class="h-6 md:h-7 mb-3.5 md:mb-4" />
        <p class="text-sm md:text-[15px] md:leading-6 text-gray-700 max-w-[320px] mb-4 md:mb-5">{{ tenant.tagline }}</p>
        <div class="flex flex-col gap-2.5 text-sm text-gray-800">
          <span class="flex gap-2 items-center"><physio-icon name="map-pin" [size]="16" class="text-gray-600" />{{ tenant.address }}</span>
          <span class="flex gap-2 items-center"><physio-icon name="phone" [size]="16" class="text-gray-600" />{{ tenant.phone }}</span>
          <span class="flex gap-2 items-center"><physio-icon name="email" [size]="16" class="text-gray-600" />{{ tenant.email }}</span>
        </div>
      </div>
      <div *ngFor="let col of cols">
        <h4 class="text-[13px] md:text-sm font-semibold mb-3 md:mb-4">{{ col.title }}</h4>
        <div class="flex flex-col md:gap-3">
          <a
            *ngFor="let item of col.items"
            [routerLink]="item.href"
            [fragment]="item.fragment"
            class="text-[15px] text-gray-700 hover:text-primaryDeep min-h-9 md:min-h-0 flex items-center"
          >{{ item.title }}</a>
        </div>
      </div>
    </div>
    <div class="pt-5 md:pt-6 flex flex-col-reverse gap-2.5 md:flex-row md:justify-between md:items-center text-[13px] md:text-sm text-gray-600">
      <span>© {{ year }} {{ tenant.name }}. All rights reserved.</span>
      <div class="flex gap-5 md:gap-6 items-center">
        <a routerLink="/privacy" class="hover:text-gray-900">Privacy Policy</a>
        <a routerLink="/term" class="hover:text-gray-900">Terms of Service</a>
        <span class="hidden md:flex gap-1.5 items-center"><physio-icon name="globe" [size]="14" />English</span>
      </div>
    </div>
  </div>
</footer>
