<!-- User List Panel - Always visible, sticky width 70px -->
<div class="sticky flex top-0 right-0 h-screen z-[1000] w-[70px]">
  <div class="flex flex-col w-full h-full bg-surface border-l border-solid border-[#E5E7EB]">
    <header class="shadow-md flex flex-col bg-primary">
      <div class="px-1 min-h-12 relative flex items-center justify-center">
        <button
          class="h-14 w-14 inline-flex items-center justify-center relative cursor-pointer text-[26px] rounded-2 p-3 transition-colors shrink-0"
          tabindex="0"
          type="button"
          (click)="openDrawer()"
        >
          <lucide-icon
            [name]="messageSquareText"
            class="w-4 h-4 stroke-white"
          ></lucide-icon>
        </button>
      </div>
    </header>
    <div class="flex flex-1 overflow-hidden">
      <div
        custom-scrollbar
        id="menu"
        class="group flex flex-col overflow-y-auto overscroll-contain py-2 w-full bg-surface"
      >
        <div class="flex shrink-0 flex-col">
          <div *ngFor="let user of users">
            <button
              class="h-auto max-h-none min-h-auto rounded-none py-1 inline-flex items-start justify-center relative w-full p-1.5 hover:bg-gray-50 transition-colors"
              tabindex="0"
              type="button"
            >
              <div class="relative">
                <div
                  value="away"
                  class="absolute w-3 h-3 bottom-0 right-0 border-2 border-solid border-white rounded-full z-[10] bg-[rgb(100,_100,_100)]"
                ></div>
                <span
                  statuscolor="rgb(251, 192, 45)"
                  class="relative inline-flex shrink-0 rounded-1.5 w-9 h-9"
                >
                  <div
                    class="h-full w-full relative flex items-center justify-center shrink-0 leading-none overflow-hidden rounded-full"
                  >
                    <img
                      alt="Bernard Langley"
                      class="w-full h-full text-center object-cover text-transparent"
                      src="https://fuse-react-vitejs-demo.fusetheme.com/assets/images/avatars/male-12.jpg"
                    />
                  </div>
                </span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Conversation Panel - Slides from right -->
<div 
  class="fixed top-0 h-screen z-[999] transition-all duration-500 ease-in-out"
  [style.right]="isOpen ? '70px' : '-290px'"
  [style.width]="'290px'"
>
  <div class="flex flex-col w-full h-full bg-surface border-l border-solid border-[#E5E7EB] shadow-lg">
    <header class="shadow-md flex flex-col bg-primary">
      <div class="px-1 py-2.5 min-h-12 relative flex items-center">
        <div class="flex flex-1 items-center gap-3 px-3">
          <p class="m-0 text-[14px] text-white font-medium whitespace-nowrap">
            Team Chat
          </p>
        </div>
        <div class="flex px-1">
          <button
            class="inline-flex items-center justify-center relative cursor-pointer text-[26px] w-9 h-9 p-3 rounded-2 hover:bg-surface/10 transition-colors"
            tabindex="0"
            type="button"
            (click)="closeDrawer()"
          >
            <lucide-icon [name]="x" class="w-4 h-4 stroke-white"></lucide-icon>
          </button>
        </div>
      </div>
    </header>
    <div class="flex flex-1 overflow-hidden">
      <div 
        class="flex flex-1 flex-col items-center justify-center p-6 bg-gray-50"
      >
        <lucide-icon 
          [name]="messageSquareText" 
          class="w-16 h-16 text-gray-300"
        ></lucide-icon>
        <p
          class="mt-6 px-4 pb-6 text-center m-0 text-[13px] leading-[1.5] text-[#4B5563]"
        >
          Select a contact to start a conversation.
        </p>
      </div>
    </div>
  </div>
</div>
