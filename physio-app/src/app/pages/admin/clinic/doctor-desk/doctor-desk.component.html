<div class="flex flex-col h-full min-h-0 p-5 gap-4">

  <!-- Loading skeleton -->
  <div *ngIf="loadingSrv.isLoading(LoadingKeys.DOCTOR_DESK.SNAPSHOT)" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <boo-icon name="loader" iconClass="w-8 h-8 text-primary animate-spin mx-auto mb-3"></boo-icon>
      <div class="text-sm text-secondary">Loading doctor desk…</div>
    </div>
  </div>

  <ng-container *ngIf="!loadingSrv.isLoading(LoadingKeys.DOCTOR_DESK.SNAPSHOT) && context() as ctx">
    <!-- Compact header -->
    <desk-header [context]="ctx"></desk-header>

    <!-- KPI strip -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
      <boo-stat-card *ngFor="let s of stats" [label]="s.label" [value]="s.value()" [icon]="s.icon"
        [tone]="s.tone"></boo-stat-card>
    </div>

    <!-- Main content -->
    <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 flex flex-col gap-4 min-h-0 overflow-y-auto" custom-scrollbar>
        <current-patient-panel [patient]="currentPatient()" (action)="onCurrentPatientAction($event)"
          (callNext)="callNextPatient()"></current-patient-panel>

        <completed-list [patients]="completedPatients()"></completed-list>
      </div>

      <div class="lg:col-span-1 min-h-0">
        <waiting-queue-panel [patients]="waitingPatients()" (call)="callPatient($event)"></waiting-queue-panel>
      </div>
    </div>
  </ng-container>
</div>
