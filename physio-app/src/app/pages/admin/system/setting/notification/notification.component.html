<div class="py-4 flex flex-col flex-1 min-h-0 h-screen overflow-y-auto"
  style="border-top-left-radius: 12px"
  custom-scrollbar>
  <div class="container">
    <div class="flex-auto w-full">

      <header class="flex flex-col mb-6">
        <admin-breadcrumb></admin-breadcrumb>
        <div class="flex items-start justify-between mt-2">
          <div>
            <p class="tracking-tight font-bold leading-none text-[22px] m-0">Notifications</p>
            <p class="text-sm text-gray-500 mt-1">Choose what you want to be notified about.</p>
          </div>
        </div>
      </header>

      <div *ngIf="loading()" class="bg-surface rounded-lg border border-gray-200 p-8 flex items-center justify-center text-sm text-gray-400">
        <boo-icon name="loader-circle" iconClass="w-5 h-5 mr-2 animate-spin" />
        Loading preferences…
      </div>

      <ng-container *ngIf="!loading()">
        <section *ngFor="let group of groups"
          class="bg-surface rounded-lg border border-gray-200 mb-6">
          <div class="p-5 border-b border-gray-100">
            <h2 class="text-base font-semibold text-gray-900 mb-1">{{ group.title }}</h2>
            <p *ngIf="group.description" class="text-sm text-gray-500">{{ group.description }}</p>
          </div>

          <div class="divide-y divide-gray-100">
            <label *ngFor="let item of group.items"
              class="flex items-start justify-between gap-4 px-5 py-4 cursor-pointer hover:bg-gray-50/60 transition-colors">
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium text-gray-900">{{ item.label }}</div>
                <div *ngIf="item.description" class="text-xs text-gray-500 mt-0.5">{{ item.description }}</div>
              </div>
              <div class="shrink-0 pt-0.5">
                <switch [isOpen]="isOn(item.key)" (change)="toggle(item.key)"></switch>
              </div>
            </label>
          </div>
        </section>

        <footer class="flex justify-end gap-2 mt-4">
          <button type="button"
            (click)="onCancel()"
            [disabled]="saving() || !isDirty()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-md hover:bg-gray-50 transition-colors disabled:opacity-50">
            Discard changes
          </button>
          <button type="button"
            (click)="onSave()"
            [disabled]="saving() || !isDirty()"
            class="inline-flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary/90 text-white text-sm font-medium rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <boo-icon *ngIf="saving()" name="loader-circle" iconClass="w-4 h-4 animate-spin" />
            <span>{{ saving() ? 'Saving…' : 'Save preferences' }}</span>
          </button>
        </footer>
      </ng-container>

    </div>
  </div>
</div>
