<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Doctors</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Search doctors by name or specialty"
      [debounce]="0"
      (ionInput)="onSearchChange($event)"
      aria-label="Search doctors"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ng-container *ngIf="isFirstLoading(); else content">
    <ion-list>
      <ion-item *ngFor="let i of [1,2,3,4,5]">
        <ion-avatar slot="start">
          <ion-skeleton-text [animated]="true"></ion-skeleton-text>
        </ion-avatar>
        <ion-label>
          <ion-skeleton-text [animated]="true" style="width: 60%;"></ion-skeleton-text>
          <ion-skeleton-text [animated]="true" style="width: 40%;"></ion-skeleton-text>
        </ion-label>
      </ion-item>
    </ion-list>
  </ng-container>

  <ng-template #content>
    <ion-card class="state-card" *ngIf="loadError">
      <ion-card-content>
        <ion-text color="medium"><p>Couldn't load doctors. Check your connection and try again.</p></ion-text>
        <ion-button fill="clear" (click)="resetAndLoad()">
          <ion-icon slot="start" name="refresh-outline"></ion-icon>
          Retry
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-card class="state-card" *ngIf="!loadError && doctors.length === 0">
      <ion-card-content>
        <ion-icon name="medical-outline" class="state-card__icon"></ion-icon>
        <ion-text color="medium"><p>No doctors found{{ searchTerm ? ' for "' + searchTerm + '"' : '' }}.</p></ion-text>
      </ion-card-content>
    </ion-card>

    <ion-list *ngIf="!loadError && doctors.length > 0">
      <ion-item button *ngFor="let doctor of doctors" (click)="goToDetail(doctor.id)" detail="false">
        <ion-avatar slot="start">
          <img [src]="doctor.avatar || 'assets/icon/favicon.png'" [alt]="doctor.fullName" />
        </ion-avatar>
        <ion-label>
          <h2>{{ doctor.fullName }}</h2>
          <p>{{ doctor.primarySpecialtyName || 'General practice' }}</p>
          <p class="meta" *ngIf="doctor.yearsOfExperience">
            <ion-icon name="time-outline"></ion-icon>
            {{ doctor.yearsOfExperience }} yrs experience
          </p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end" color="medium"></ion-icon>
      </ion-item>
    </ion-list>

    <ion-infinite-scroll (ionInfinite)="loadMore($event)" [disabled]="!page.hasNext">
      <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Loading more doctors..."></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ng-template>
</ion-content>
