<admin-content-header>
  <div class="flex items-center gap-2 pb-3 mb-2 border-b border-gray-200">
    <div class="flex-1">
      <h4 class="text-[22px] text-primary font-semibold mb-0">File Manager</h4>
      <p class="text-sm text-secondary m-0">Browse and organise uploaded files</p>
    </div>
    <boo-button-admin
      [icon]="{ name: 'plus', size: 16 }"
      textColor="white"
      [disabled]="true"
      title="File storage is not available yet"
    >
      Upload File
    </boo-button-admin>
  </div>

  <div class="flex-1 min-h-0 bg-surface rounded-[6px] border border-gray-200 overflow-hidden">
    <boo-empty-state
      icon="folder"
      title="File storage is not connected yet"
      description="The server has no file library API, so there is nothing to browse or upload here. Files attached to records, such as avatars, are managed from those records."
    ></boo-empty-state>
  </div>
</admin-content-header>
