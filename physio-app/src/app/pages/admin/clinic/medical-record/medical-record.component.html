<div class="flex flex-1 min-h-0 flex-col">
  <!-- Loading skeleton -->
  <div *ngIf="isLoading()" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <boo-spinner [inline]="true" tone="primary" [size]="32" class="mb-3" />
      <div class="text-sm text-secondary">Loading medical record…</div>
    </div>
  </div>

  <!-- Error state -->
  <div *ngIf="!isLoading() && error()" class="flex-1 flex items-center justify-center">
    <boo-error-state title="Couldn't load medical record" [description]="error()" (retry)="retryLoad()"></boo-error-state>
  </div>

  <ng-container *ngIf="!isLoading() && !error()">
    <!-- Sticky patient context + snapshot + tab nav -->
    <div class="mb-4 shrink-0 overflow-hidden rounded-2 border border-borderGray/60 bg-surface">
      <mr-patient-context-header [patient]="patient()" (action)="onQuickAction($event)"></mr-patient-context-header>
      <mr-clinical-snapshot [snapshot]="snapshot()"></mr-clinical-snapshot>

      <!-- Tab nav -->
      <boo-tabs class="border-gray-200" [tabs]="tabItems()" [value]="activeTab()" (valueChange)="setTab($event)" label="Medical record sections" listClass="px-6 gap-1" />
    </div>

    <!-- Tab content -->
    <main class="boo-scrollbar min-h-0 min-w-0 flex-1 overflow-auto pb-5">
      <mr-overview-tab *ngIf="activeTab() === 'overview'" [patient]="patient()" [demographics]="demographics()"
        [history]="history()" [allergies]="allergies()" />

      <mr-encounters-tab *ngIf="activeTab() === 'encounters'" [data]="encounters()" />
      <mr-diagnoses-tab *ngIf="activeTab() === 'diagnoses'" [data]="diagnoses()" />
      <mr-prescriptions-tab *ngIf="activeTab() === 'prescriptions'" [data]="prescriptions()" />
      <mr-laboratory-tab *ngIf="activeTab() === 'lab'" [results]="labResults()" [reports]="labReports()" />
      <mr-imaging-tab *ngIf="activeTab() === 'imaging'" [data]="imaging()" />
      <mr-clinical-notes-tab *ngIf="activeTab() === 'notes'" [data]="notes()" />
      <mr-billing-tab *ngIf="activeTab() === 'billing'" [summary]="billing()" />
    </main>
  </ng-container>
</div>

<clinical-action-drawer
  [isOpen]="actionOpen()"
  [action]="action"
  [patientId]="patientId"
  [patientName]="patient()?.fullName ?? ''"
  (close)="actionOpen.set(false)"
  (done)="onActionDone()" />
