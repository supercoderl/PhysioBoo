<div>
  <div
    [ngClass]="{
      'fixed md:sticky top-0 z-20 h-screen flex-auto shrink-0 flex-col border-r border-solid border-borderGray transition-all duration-500': true,
      'min-w-0 w-0 max-w-0 md:min-w-[280px] md:w-[280px] md:max-w-[280px]':
        !isCollapsed,
      'min-w-[280px] w-[280px] max-w-[280px] shadow-lg md:shadow-none md:min-w-0 md:w-0 md:max-w-0':
        isCollapsed
    }"
  >
    <div
      class="flex h-full flex-auto flex-col overflow-hidden text-[#1F232B] bg-menu transition-all duration-300"
    >
      <div class="flex h-12 shrink-0 flex-row items-center px-5 md:h-16">
        <div class="flex flex-shrink-0 flex-grow items-center gap-3">
          <div class="flex flex-1 items-center gap-2">
            <img
              class="w-1/3 h-auto"
              alt="logo"
              src="../../../../assets/logo/logo.webp"
            />
          </div>
        </div>
      </div>
      <div
        class="flex min-h-0 h-full flex-1 flex-col w-full"
        style="
          position: relative;
          overscroll-behavior: contain;
          background-repeat: no-repeat;
          background-size: 100% 40px, 100% 10px;
          background-attachment: local, scroll;
        "
      >
        <div class="group h-full">
          <div
            id="menu"
            class="px-3 flex-1 max-h-[calc(100%_-_80px)] overflow-y-auto"
            custom-scrollbar
          >
            <div *ngFor="let menu of menus" class="mb-1">
              <!-- Section Header -->
              <p
                class="px-2.5 mb-1.5 leading-none truncate max-w-full font-semibold text-[11px] uppercase tracking-wide text-secondary/70"
              >
                {{ menu.label }}
              </p>

              <!-- Section Items -->
              <ng-container *ngIf="menu.children">
                <sidebar-item
                  *ngFor="let child of menu.children"
                  [item]="child"
                ></sidebar-item>
              </ng-container>

              <div
                class="h-4"
                *ngIf="menus.indexOf(menu) < menus.length - 1"
              ></div>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-3 p-3 absolute bottom-0 w-full">
          <popup [(isOpen)]="isOpen" position="top-right">
            <button
              trigger
              class="flex items-center shrink-0 justify-start h-14 min-h-14 px-2 gap-3 w-full relative cursor-pointer text-[13px] rounded-1.5 transition-all duration-300 hover:bg-[rgba(0,_0,_0,_0.05)]"
              tabindex="0"
              type="button"
            >
              <boo-avatar
                [src]="(userInfo$ | async)?.profilePicture"
                [allowBorder]="true"
              />
              <div class="flex flex-auto flex-col gap-1 min-w-0">
                <span class="flex truncate leading-none font-semibold text-sm text-regular m-0">
                  {{ (userInfo$ | async)?.profile?.fullName || 'Guest' }}
                </span>
                <p
                  class="flex truncate leading-none font-normal text-xs text-secondary m-0"
                >
                  {{ (userInfo$ | async)?.email }}
                </p>
              </div>
              <div class="flex shrink-0 items-center gap-2">
                <lucide-icon [name]="info" class="w-4 h-4 stroke-regular"></lucide-icon>
                <lucide-icon [name]="chevronUp" class="w-4 h-4 stroke-regular"></lucide-icon>
              </div>
            </button>
            <div content class="min-w-32 max-w-32 bg-surface rounded-[8px]">
              <button-icon
                [icon]="{ name: 'circle-user' }"
                buttonClass="border-0 w-full !justify-start"
                routerLink="/admin/profile"
              >
                My Profile
              </button-icon>
              <button-icon
                [icon]="{ name: 'mail' }"
                buttonClass="border-0 w-full !justify-start"
              >
                Inbox
              </button-icon>
              <button-icon
                [icon]="{ name: 'circle-power', color: '#a2b223' }"
                buttonClass="border-0 w-full text-[#a2b223] !justify-start"
                (onClick)="logout()"
                [loading]="loadingSrv.isLoading('logout')"
              >
                Logout
              </button-icon>
            </div>
          </popup>
        </div>
      </div>
    </div>
  </div>
</div>
