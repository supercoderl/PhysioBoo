<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/patient/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <app-state-message
    *ngIf="!patientId"
    variant="empty"
    title="No patient record linked"
    message="Your account isn't linked to a patient record yet. Please visit reception to complete your registration."
  ></app-state-message>

  <ng-container *ngIf="patientId">
    <ion-list *ngIf="loading()">
      <ion-item>
        <ion-skeleton-text animated style="width: 100%; height: 24px;"></ion-skeleton-text>
      </ion-item>
    </ion-list>

    <app-state-message
      *ngIf="!loading() && loadFailed()"
      variant="permission"
      title="Not available yet"
      message="We can't load your patient record for editing right now. Please contact reception to update your details."
    ></app-state-message>

    <form *ngIf="!loading() && !loadFailed()" [formGroup]="form" (ngSubmit)="submit()">
      <ion-list lines="full" class="form-list">
        <ion-item>
          <ion-input
            label="Insurance provider"
            labelPlacement="stacked"
            formControlName="inssuranceProvider"
            placeholder="e.g. National Health Insurance"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Insurance policy number"
            labelPlacement="stacked"
            formControlName="inssurancePolicyNumber"
            placeholder="Policy number"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-textarea
            label="Allergies"
            labelPlacement="stacked"
            formControlName="allergyInformation"
            placeholder="List any known allergies"
            autoGrow="true"
            rows="3"
          ></ion-textarea>
        </ion-item>
        <ion-item lines="none">
          <ion-textarea
            label="Current medications"
            labelPlacement="stacked"
            formControlName="currentMedications"
            placeholder="List medications you're currently taking"
            autoGrow="true"
            rows="3"
          ></ion-textarea>
        </ion-item>
      </ion-list>

      <ion-button expand="block" type="submit" class="submit-btn" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save changes' }}
      </ion-button>
    </form>
  </ng-container>
</ion-content>
