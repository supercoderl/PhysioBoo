<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/news"></ion-back-button>
    </ion-buttons>
    <ion-title>Article</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ng-container *ngIf="isLoading()">
    <div class="header-skel ion-padding">
      <ion-skeleton-text [animated]="true" style="width: 100%; height: 180px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 80%; height: 20px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 100%;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 100%;"></ion-skeleton-text>
    </div>
  </ng-container>

  <ion-card class="state-card" *ngIf="!isLoading() && loadError">
    <ion-card-content>
      <ion-text color="medium"><p>Couldn't load this article.</p></ion-text>
      <ion-button fill="clear" (click)="load()">
        <ion-icon slot="start" name="refresh-outline"></ion-icon>
        Retry
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card class="state-card" *ngIf="!isLoading() && !loadError && notFound">
    <ion-card-content>
      <ion-text color="medium"><p>This article could not be found.</p></ion-text>
    </ion-card-content>
  </ion-card>

  <ng-container *ngIf="!isLoading() && !loadError && article as article">
    <img *ngIf="article.coverImageUrl" [src]="article.coverImageUrl" [alt]="article.title" class="cover" />
    <div class="body ion-padding">
      <h1>{{ article.title }}</h1>
      <div class="meta">
        <span *ngIf="article.author">
          <ion-icon name="person-outline"></ion-icon>
          {{ article.author }}
        </span>
        <span *ngIf="article.publishDate">
          <ion-icon name="calendar-outline"></ion-icon>
          {{ article.publishDate | date: 'mediumDate' }}
        </span>
        <span *ngIf="article.readTime">
          <ion-icon name="time-outline"></ion-icon>
          {{ article.readTime }}
        </span>
      </div>
      <p class="excerpt" *ngIf="article.excerpt">{{ article.excerpt }}</p>
      <div class="content" [innerHTML]="safeContent"></div>
    </div>
  </ng-container>
</ion-content>
