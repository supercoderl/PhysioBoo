<admin-content-header>
  <div
    class="flex min-w-0 flex-auto flex-col gap-2 sm:flex-row sm:items-center"
  >
    <div class="flex flex-col flex-auto justify-center">
      <span style="transform: none">
        <p class="text-[24px] leading-none font-extrabold tracking-tight m-0">
          File Manager
        </p>
      </span>
      <span style="opacity: 1; transform: none">
        <p class="font-medium m-0 text-[13px] leading-[1.5] text-[#4B5563]">
          3 folders, 13 files
        </p>
      </span>
    </div>
    <div class="flex items-center">
      <boo-button-admin [icon]="{ name: 'plus', size: 16 }">
        Upload File
      </boo-button-admin>
    </div>
  </div>
</admin-content-header>
<div
  class="relative z-10 container flex h-full flex-auto flex-col overflow-hidden"
>
  <div class="flex flex-1 z-[2] max-w-full h-full min-w-0 bg-surface rounded-t-[12px] mt-0.5 mx-0.5 absolute inset-0 oveflow-hidden">
    <div
      id=""
      class="relative ps flex flex-col flex-1 min-h-full"
    >
      <div class="flex-[1_0_auto]">
        <div class="flex flex-col gap-8 p-4 md:p-8">
          <div class="flex flex-col gap-2">
            <p
              class="m-0 text-[13px] leading-[1.5] font-semibold"
            >
              Folders
            </p>
            <div class="flex flex-wrap gap-3">
              <file-item
                *ngFor="let folder of folders"
                [fileInfo]="folder"
              ></file-item>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <p
              class="m-0 text-[13px] leading-[1.5] font-semibold"
            >
              Files
            </p>
            <div class="flex flex-wrap gap-3">
              <file-item 
                *ngFor="let file of files"
                [fileInfo]="file"
              ></file-item>
            </div>
          </div>
        </div>
      </div>
      <div class="ps__rail-x" style="left: 0px; bottom: 0px">
        <div
          class="ps__thumb-x"
          tabindex="0"
          style="left: 0px; width: 0px"
        ></div>
      </div>
      <div class="ps__rail-y" style="top: 0px; right: 0px">
        <div
          class="ps__thumb-y"
          tabindex="0"
          style="top: 0px; height: 0px"
        ></div>
      </div>
    </div>
    <div
      class="MuiDrawer-root MuiDrawer-anchorRight MuiDrawer-docked FusePageCarded-sidebarWrapper permanent closed FusePageCarded-rightSidebar muiltr-ft2wic"
    >
      <div
        class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation0 MuiDrawer-paper FusePageCarded-sidebar permanent MuiDrawer-paperAnchorRight MuiDrawer-paperAnchorDockedRight muiltr-19nm3so"
        style="--Paper-shadow: var(--mui-shadows-0)"
      >
        <div id="" class="muiltr-1aat207 ps" style="position: relative">
          <div class="FusePageCarded-sidebarContent lg:min-w-0"></div>
          <div class="ps__rail-x" style="left: 0px; bottom: 0px">
            <div
              class="ps__thumb-x"
              tabindex="0"
              style="left: 0px; width: 0px"
            ></div>
          </div>
          <div class="ps__rail-y" style="top: 0px; right: 0px">
            <div
              class="ps__thumb-y"
              tabindex="0"
              style="top: 0px; height: 0px"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
