<div class="py-4 flex flex-col flex-1 min-h-0 h-screen overflow-y-auto"
  style="border-top-left-radius: 12px"
  custom-scrollbar>
  <div class="container">
    <div class="flex-auto w-full">

      <header class="flex flex-col mb-6">
        <admin-breadcrumb></admin-breadcrumb>
        <div class="flex items-start justify-between mt-2 gap-4">
          <div>
            <p class="tracking-tight font-bold leading-none text-[22px] m-0">Account</p>
            <p class="text-sm text-gray-500 mt-1">Your public profile and private personal information.</p>
          </div>
          <ng-container *ngIf="(userInfo$ | async) as u">
            <div class="flex items-center gap-2 shrink-0" *ngIf="u?.email">
              <span class="text-[10px] font-semibold uppercase tracking-wider text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded inline-flex items-center gap-1"
                *ngIf="u?.isVerified">
                <boo-icon name="badge-check" iconClass="w-3 h-3" />
                Verified
              </span>
              <span class="text-[10px] font-semibold uppercase tracking-wider text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded inline-flex items-center gap-1"
                *ngIf="!u?.isVerified">
                <boo-icon name="alert-circle" iconClass="w-3 h-3" />
                Unverified
              </span>
            </div>
          </ng-container>
        </div>
      </header>

      <form class="flex flex-col gap-6">

        <section class="bg-surface rounded-lg border border-gray-200 p-5">
          <admin-account-profile [userInfo]="(userInfo$ | async)" />
        </section>

        <section class="bg-surface rounded-lg border border-gray-200 p-5">
          <admin-account-contact />
        </section>

        <section class="bg-surface rounded-lg border border-gray-200 p-5">
          <admin-account-emergency />
        </section>

        <!-- <ng-container *ngIf="(userInfo$ | async | defaultUser).doctor != null">
          <section class="bg-surface rounded-lg border border-gray-200 p-5">
            <admin-account-doctor />
          </section>
        </ng-container> -->

        <!-- <ng-container *ngIf="(userInfo$ | async).patient != null">
          <section class="bg-surface rounded-lg border border-gray-200 p-5">
            <admin-account-patient />
          </section>
        </ng-container> -->

        <section class="bg-surface rounded-lg border border-red-200 p-5">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h2 class="text-base font-semibold text-red-700 mb-1">Danger zone</h2>
              <p class="text-sm text-gray-500">Permanent actions that affect your account.</p>
            </div>
            <button type="button"
              class="px-4 py-2 text-sm font-medium text-red-600 bg-white border border-red-200 rounded-md hover:bg-red-50 transition-colors">
              Delete account
            </button>
          </div>
        </section>

        <footer class="flex justify-end gap-2">
          <button type="button" (click)="onCancel()" [disabled]="saving()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-md hover:bg-gray-50 transition-colors disabled:opacity-50">
            Discard changes
          </button>
          <button type="button" (click)="onSave()" [disabled]="saving()"
            class="inline-flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary/90 text-white text-sm font-medium rounded-md transition-colors disabled:opacity-50">
            <boo-icon *ngIf="saving()" name="loader-circle" iconClass="w-4 h-4 animate-spin" />
            <span>{{ saving() ? 'Saving…' : 'Save changes' }}</span>
          </button>
        </footer>

      </form>

    </div>
  </div>
</div>
