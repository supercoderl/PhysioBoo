<common-category-page
  heading="Manufacturers"
  description="Companies that make the medicines and supplies the pharmacy stocks"
  plural="manufacturers"
  createLabel="New manufacturer"
  [countLabel]="countLabel"
  [canCreate]="canCreate"
  [chips]="chips"
  [loading]="loading()"
  [loadFailed]="loadFailed()"
  [hasData]="!!tableData()"
  (create)="onOpenDrawer(null)"
  (removeChip)="removeChip($event)"
  (clearFilters)="clearFilters()"
  (retry)="load()"
>
  <div #tableHost class="flex flex-1 min-h-0 min-w-0 flex-col">
    <common-category-manufacturer-table-card
      [data]="tableData()"
      [filter]="params"
      [loading]="loading()"
      [sortOptions]="sortOptions"
      [currentSort]="params.sort"
      [filterConfigs]="filterConfigs"
      [currentFilter]="params.filter"
      [canUpdate]="canUpdate"
      [canDelete]="canDelete"
      (pageChange)="onPageChanged($event)"
      (searchChange)="onSearch($event)"
      (reloadClick)="load()"
      (sortApply)="onSortChange($event)"
      (filterApply)="onFilterChange($event)"
      (editClick)="onOpenDrawer($event)"
      (deleteClick)="onDelete($event)"
      (bulkAction)="onBulkAction($event)"
    />
  </div>
</common-category-page>

<common-category-manufacturer-drawer
  [isOpen]="isDrawerOpen"
  [currentId]="selectedId"
  [canDelete]="canDelete"
  (close)="onCloseDrawer()"
  (saveSuccess)="onSaveSuccess()"
  (delete)="onDelete($event)"
/>
