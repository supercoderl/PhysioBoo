<div class="sticky top-0 z-[999]">
  <div *ngIf="tenant.showEmergency" class="bg-gray-900 text-white text-[13px] leading-[18px] xl:text-sm">
    <div class="max-w-[1200px] mx-auto px-5 xl:px-0 py-2.5 flex gap-2.5 items-start xl:items-center">
      <physio-icon name="siren" [size]="16" class="text-[#FDA4AF] mt-0.5 xl:mt-0" />
      <span>In a medical emergency, call your local emergency number. Clinic line: <b class="font-semibold">{{ tenant.phone }}</b></span>
    </div>
  </div>

  <header class="bg-surface border-b border-gray-200">
    <div class="max-w-[1200px] mx-auto h-16 xl:h-[76px] pl-5 pr-3 xl:px-0 flex items-center gap-10">
      <a routerLink="/" aria-label="Home" class="flex items-center">
        <img src="assets/logo/logo.webp" [alt]="tenant.name" class="h-6 xl:h-[30px]" />
      </a>

      <nav aria-label="Main" class="hidden xl:flex gap-1 text-[15px] font-medium">
        <a
          *ngFor="let item of nav"
          [routerLink]="item.href"
          [fragment]="item.fragment"
          [attr.aria-current]="isActive(item) ? 'page' : null"
          class="px-3 py-2 rounded-lg transition-colors"
          [ngClass]="isActive(item)
            ? 'bg-primarySoft text-primaryDeep'
            : 'text-gray-700 hover:bg-gray-100 hover:text-gray-900'"
        >{{ item.title }}</a>
      </nav>

      <div class="ml-auto hidden xl:flex items-center gap-2">
        <div class="relative" data-lang-menu>
          <button
            type="button"
            (click)="toggleLang()"
            [attr.aria-expanded]="langOpen"
            aria-haspopup="menu"
            class="h-10 px-2.5 border-0 bg-transparent rounded-lg flex gap-1.5 items-center text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer"
          >
            <physio-icon name="globe" [size]="16" />EN<physio-icon name="chevron-down" [size]="14" />
          </button>
          <div
            *ngIf="langOpen"
            role="menu"
            class="absolute top-[46px] right-0 w-[200px] bg-surface border border-gray-200 rounded-xl shadow-[0_12px_32px_rgba(38,20,26,.12)] p-1.5 z-10"
          >
            <div role="menuitemradio" aria-checked="true" class="px-3 py-2.5 rounded-lg bg-gray-100 text-sm font-medium flex justify-between items-center">
              English <physio-icon name="check" [size]="16" class="text-primary" />
            </div>
            <p class="px-3 py-2.5 text-xs text-gray-600">More languages appear here when a tenant enables them.</p>
          </div>
        </div>

        <!-- Signed in: /auth/login's guest guard forwards to the user's own area (patient, admin or super admin). -->
        <a
          *ngIf="isAuthenticated()"
          routerLink="/auth/login"
          class="h-10 px-3.5 rounded-[10px] flex gap-2 items-center text-sm font-medium text-gray-900 border border-gray-300 hover:border-gray-400"
        >
          <physio-icon name="circle-user" [size]="15" />My account
        </a>
        <ng-container *ngIf="!isAuthenticated()">
          <a routerLink="/auth/login" class="h-10 px-3.5 rounded-[10px] flex items-center text-sm font-medium text-gray-900 hover:bg-gray-100">Log in</a>
          <a routerLink="/auth/register" class="h-10 px-3.5 rounded-[10px] flex items-center text-sm font-medium text-gray-900 border border-gray-300 hover:border-gray-400">Sign up</a>
        </ng-container>
        <a
          routerLink="/doctor"
          class="h-10 px-4 rounded-[10px] flex gap-2 items-center text-sm font-semibold text-white bg-primary hover:bg-primaryHover hover:text-white"
        >
          <physio-icon name="search" [size]="15" />Find a doctor
        </a>
      </div>

      <div class="ml-auto flex xl:hidden gap-1">
        <a routerLink="/doctor" aria-label="Find a doctor" class="w-11 h-11 rounded-[10px] flex items-center justify-center text-gray-900">
          <physio-icon name="search" [size]="20" />
        </a>
        <button
          type="button"
          (click)="onToggle()"
          aria-label="Open menu"
          [attr.aria-expanded]="isOpen"
          class="w-11 h-11 border-0 rounded-[10px] bg-gray-100 flex items-center justify-center text-gray-900 cursor-pointer"
        >
          <physio-icon name="menu" [size]="20" />
        </button>
      </div>
    </div>
  </header>
</div>

<!-- Mobile menu -->
<div *ngIf="isOpen" class="xl:hidden fixed inset-0 bg-surface z-[1000] flex flex-col overflow-y-auto" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="h-16 pl-5 pr-3 flex items-center justify-between border-b border-gray-200 flex-none">
    <img src="assets/logo/logo.webp" [alt]="tenant.name" class="h-6" />
    <button
      type="button"
      (click)="closeMenu()"
      aria-label="Close menu"
      class="w-11 h-11 border-0 rounded-[10px] bg-gray-100 flex items-center justify-center text-gray-900 cursor-pointer"
    >
      <physio-icon name="x" [size]="20" />
    </button>
  </div>
  <nav class="p-3 flex flex-col gap-0.5">
    <a
      *ngFor="let item of nav"
      [routerLink]="item.href"
      [fragment]="item.fragment"
      (click)="closeMenu()"
      [attr.aria-current]="isActive(item) ? 'page' : null"
      class="h-[52px] px-3.5 rounded-[10px] flex items-center justify-between text-[17px]"
      [ngClass]="isActive(item) ? 'font-semibold bg-primarySoft text-primaryDeep' : 'font-medium text-gray-900'"
    >
      {{ item.title }}
      <physio-icon *ngIf="!isActive(item)" name="chevron-right" [size]="18" class="text-gray-400" />
    </a>
  </nav>
  <div class="mt-auto px-6 pt-4 pb-7 flex flex-col gap-2.5 border-t border-gray-200">
    <a routerLink="/doctor" (click)="closeMenu()" class="h-[52px] rounded-xl bg-primary text-white text-base font-semibold flex gap-2 items-center justify-center hover:text-white">
      <physio-icon name="search" [size]="18" />Find a doctor
    </a>
    <a
      *ngIf="isAuthenticated()"
      routerLink="/auth/login"
      (click)="closeMenu()"
      class="h-12 rounded-xl border border-gray-300 text-[15px] font-semibold flex gap-2 items-center justify-center"
    >
      <physio-icon name="circle-user" [size]="16" />My account
    </a>
    <div *ngIf="!isAuthenticated()" class="grid grid-cols-2 gap-2.5">
      <a routerLink="/auth/login" (click)="closeMenu()" class="h-12 rounded-xl border border-gray-300 text-[15px] font-semibold flex items-center justify-center">Log in</a>
      <a routerLink="/auth/register" (click)="closeMenu()" class="h-12 rounded-xl border border-gray-300 text-[15px] font-semibold flex items-center justify-center">Sign up</a>
    </div>
    <span class="text-sm text-gray-600 flex gap-2 items-center justify-center pt-1.5">
      <physio-icon name="globe" [size]="16" />English
    </span>
  </div>
</div>
