<div id="" class="ps relative flex flex-col flex-1 min-h-0" custom-scrollbar>
  <div class="container">
    <div class="max-w-2xl flex-auto p-4 md:p-6">
      <div class="flex flex-col mb-4">
        <admin-breadcrumb></admin-breadcrumb>
        <div class="flex items-center gap-2">
          <p
            class="lg:ml-0 tracking-tight font-bold leading-none text-[22px] m-0"
          >
            Account
          </p>
        </div>
      </div>
      <div class="w-full max-w-5xl">
        <form class="flex w-full flex-col gap-12">
          <div class="flex flex-col gap-4">
            <div class="w-full">
              <p class="font-medium text-base m-0">Profile</p>
              <p class="m-0 text-[13px] leading-[1.5] text-[#4B5563]">
                Following information is publicly displayed, be careful!
              </p>
            </div>
            <div class="grid w-full gap-4 sm:grid-cols-4">
              <div class="sm:col-span-4">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Name' }">
                    <boo-icon
                      name="circle-user"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-4">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Username' }"> </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-2">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Title' }">
                    <boo-icon
                      name="briefcase"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-2">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Company' }">
                    <boo-icon
                      name="building-2"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-4">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-textarea-v2>
                    <boo-icon
                      name="land-plot"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-textarea-v2>
                  <p
                    class="ml-0 text-[#4B5563] leading-[1.66] text-left mt-0.75 mr-3.5 text-[12px]"
                    id="about-helper-text"
                  >
                    <span class="flex flex-col">
                      <span>
                        Brief description for your profile. Basic HTML and Emoji
                        are allowed.
                      </span>
                      <span></span>
                    </span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div class="flex w-full flex-col gap-4">
            <div class="w-full">
              <p class="font-medium text-base m-0">Personal Information</p>
              <p class="m-0 text-[13px] leading-[1.5] text-[#4B5563]">
                Communication details in case we want to connect with you. These
                will be kept private.
              </p>
            </div>
            <div class="grid w-full gap-4 sm:grid-cols-4">
              <div class="sm:col-span-2">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Email' }">
                    <boo-icon
                      name="mail"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-2">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Phone Number' }">
                    <boo-icon
                      name="phone"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-2">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Country' }">
                    <boo-icon
                      name="flag"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
              <div class="sm:col-span-2">
                <div
                  class="w-full inline-flex flex-col relative min-w-0 p-0 m-0 border-0"
                >
                  <boo-input-v2 [label]="{ text: 'Language' }">
                    <boo-icon
                      name="globe"
                      class="leading-none"
                      prefix
                    ></boo-icon>
                  </boo-input-v2>
                </div>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-end gap-2">
            <boo-button-admin>Cancel</boo-button-admin>
            <boo-button-admin>Save</boo-button-admin>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
