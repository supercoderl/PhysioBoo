<!-- Intro: breadcrumb, title, search, live result count -->
<section class="bg-gray-50 border-b border-gray-200">
  <div class="public-container pt-6 pb-7 md:pt-8 md:pb-10 lg:pt-10 lg:pb-12">
    <boo-breadcrumb class="mb-5" [items]="[{ label: 'Home', link: '/' }, { label: 'Doctors' }]" />

    <h1 class="text-[30px] leading-9 md:text-[38px] md:leading-[46px] lg:text-[44px] lg:leading-[52px] font-semibold tracking-[-0.02em] text-gray-900 mb-3 max-w-[760px] text-balance">
      Find the Right Specialist for Your Recovery
    </h1>
    <p class="text-base leading-[26px] text-gray-700 mb-7 max-w-[640px]">
      Browse physiotherapists and rehabilitation specialists in the network. Filter by specialty, facility or
      consultation type, then view a profile or request an appointment.
    </p>

    <div class="flex gap-4 items-center flex-wrap">
      <boo-search-field
        class="flex-[1_1_320px] max-w-[640px]"
        label="Search doctors"
        placeholder="Search by doctor name or specialty"
        [busy]="searching"
        [ngModel]="qInput"
        (ngModelChange)="onSearchInput($event)"
        (clear)="clearSearch()"
      />
      <p role="status" aria-live="polite" class="text-sm text-gray-700 m-0">
        <b class="font-semibold text-gray-900">{{ countLabel }}</b>
      </p>
    </div>
  </div>
</section>

<div #results class="public-container pt-5 pb-10 md:pt-7 md:pb-16 lg:pt-8 lg:pb-20 scroll-mt-24">
  <!-- Filter bar (tablet and desktop) -->
  <div role="group" aria-label="Filters" class="hidden md:flex gap-3 items-end flex-wrap mb-4">
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-gray-700 flex-[1_1_220px] max-w-[280px]">
      Specialty
      <select
        [ngModel]="query.specialty"
        (ngModelChange)="setSpecialty($event)"
        class="h-11 border border-gray-300 rounded-[10px] px-3 text-[15px] font-normal text-gray-900 bg-surface focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
      >
        <option value="">All specialties</option>
        <option *ngFor="let o of specialties" [value]="o.id">{{ o.name }}</option>
      </select>
    </label>
    <label class="flex flex-col gap-1.5 text-[13px] font-semibold text-gray-700 flex-[1_1_220px] max-w-[280px]">
      Clinic or facility
      <select
        [ngModel]="query.facility"
        (ngModelChange)="setFacility($event)"
        class="h-11 border border-gray-300 rounded-[10px] px-3 text-[15px] font-normal text-gray-900 bg-surface focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
      >
        <option value="">All facilities</option>
        <option *ngFor="let o of facilities" [value]="o.id">{{ o.name }}</option>
      </select>
    </label>
    <fieldset class="border-0 m-0 p-0 flex flex-col gap-1.5">
      <legend class="text-[13px] font-semibold text-gray-700 p-0 mb-1.5">Consultation type</legend>
      <div class="flex gap-1.5">
        <button boo-button [variant]="query.online ? 'soft' : 'secondary'" (click)="toggleOnline()" [attr.aria-pressed]="query.online" class="!gap-1.5 !px-3.5">
          <physio-icon name="video" [size]="16" />Online
        </button>
        <button boo-button [variant]="query.homeVisit ? 'soft' : 'secondary'" (click)="toggleHomeVisit()" [attr.aria-pressed]="query.homeVisit" class="!gap-1.5 !px-3.5">
          <physio-icon name="house" [size]="16" />Home visit
        </button>
      </div>
    </fieldset>
    <button *ngIf="chips.length" boo-button variant="link" (click)="clearAll()" class="ml-auto">Clear all filters</button>
  </div>

  <!-- Filter button (mobile) -->
  <div class="md:hidden flex gap-2.5 items-center mb-3.5">
    <button
      #filterButton
      boo-button
      variant="secondary"
      size="lg"
      (click)="openDrawer()"
      [attr.aria-expanded]="drawerOpen"
      aria-controls="filter-drawer"
      class="flex-1"
    >
      <physio-icon name="sliders-horizontal" [size]="18" />{{ filterButtonLabel }}
    </button>
    <button *ngIf="chips.length" boo-button variant="link" size="lg" (click)="clearAll()">Clear all</button>
  </div>

  <!-- Active filter chips -->
  <boo-filter-chips class="mb-5" [chips]="chips" (remove)="removeChip($event)" />

  <!-- Loading -->
  <div *ngIf="state === 'loading'" aria-busy="true" aria-label="Loading doctors" class="grid grid-cols-[repeat(auto-fill,minmax(300px,1fr))] gap-5">
    <doctor-card *ngFor="let s of skeletons; let i = index" [skeleton]="true" [class.hidden]="i >= 2" class="md:!block" />
  </div>

  <!-- Error -->
  <boo-error-state
    *ngIf="state === 'error'"
    appearance="panel"
    icon="cloud-off"
    title="We couldn't load doctors"
    [description]="failure.description"
    [showRetry]="failure.retryable"
    retryLabel="Try again"
    (retry)="retry()"
  />

  <!-- Empty -->
  <boo-empty-state
    *ngIf="state === 'empty'"
    appearance="panel"
    icon="search-x"
    [title]="chips.length ? 'No doctors match these filters' : 'No doctors are listed yet'"
    [description]="chips.length
      ? 'Try a different specialty or facility, or remove a filter. You can also contact the clinic to ask about availability.'
      : 'Doctor profiles appear here once the clinic publishes them. You can still contact us to ask about an appointment.'"
  >
    <button *ngIf="chips.length" boo-button variant="primary" (click)="clearAll()">Clear all filters</button>
    <a boo-button variant="secondary" routerLink="/contact">Contact us</a>
  </boo-empty-state>

  <!-- Results -->
  <ng-container *ngIf="state === 'results'">
    <ul class="list-none m-0 p-0 grid grid-cols-[repeat(auto-fill,minmax(300px,1fr))] gap-5">
      <li *ngFor="let d of doctors; trackBy: trackById" class="motion-fade"><doctor-card [doctor]="d" /></li>
    </ul>

    <boo-pagination class="mt-8" [page]="query.page" [totalPages]="totalPages" (pageChange)="goToPage($event)" />
  </ng-container>
</div>

<!-- Filter drawer (mobile) -->
<boo-sheet
  *ngIf="drawerOpen"
  class="md:hidden"
  heading="Filters"
  panelId="filter-drawer"
  closeLabel="Close filters"
  [returnFocus]="filterButtonElement"
  (dismiss)="closeDrawer()"
>
  <div class="p-5 flex flex-col gap-[22px] overflow-auto">
    <label class="flex flex-col gap-2 text-sm font-semibold text-gray-900">
      Specialty
      <select
        [ngModel]="query.specialty"
        (ngModelChange)="setSpecialty($event)"
        class="h-12 border border-gray-300 rounded-xl px-3 text-base font-normal text-gray-900 bg-surface"
      >
        <option value="">All specialties</option>
        <option *ngFor="let o of specialties" [value]="o.id">{{ o.name }}</option>
      </select>
    </label>
    <label class="flex flex-col gap-2 text-sm font-semibold text-gray-900">
      Clinic or facility
      <select
        [ngModel]="query.facility"
        (ngModelChange)="setFacility($event)"
        class="h-12 border border-gray-300 rounded-xl px-3 text-base font-normal text-gray-900 bg-surface"
      >
        <option value="">All facilities</option>
        <option *ngFor="let o of facilities" [value]="o.id">{{ o.name }}</option>
      </select>
    </label>
    <fieldset class="border-0 m-0 p-0">
      <legend class="text-sm font-semibold p-0 mb-2">Consultation type</legend>
      <div class="flex flex-col gap-2">
        <label class="min-h-12 flex gap-3 items-center text-[15px]">
          <input type="checkbox" [checked]="query.online" (change)="toggleOnline()" class="w-5 h-5 accent-primary" />
          Online consultation
        </label>
        <label class="min-h-12 flex gap-3 items-center text-[15px]">
          <input type="checkbox" [checked]="query.homeVisit" (change)="toggleHomeVisit()" class="w-5 h-5 accent-primary" />
          Home visit
        </label>
      </div>
    </fieldset>
  </div>
  <div class="grid grid-cols-[1fr_1.6fr] gap-2.5 px-5 pt-3.5 pb-5 border-t border-gray-200">
    <button boo-button variant="secondary" size="lg" [block]="true" (click)="clearAll()">Clear all</button>
    <button boo-button variant="primary" size="lg" [block]="true" (click)="closeDrawer()">{{ state === 'loading' ? 'Updating…' : showLabel }}</button>
  </div>
</boo-sheet>
