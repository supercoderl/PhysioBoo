<div class="px-6 py-3">
  <p
    id="admin-font-size-label"
    class="font-semibold text-md gap-2 flex-center-center mb-3 leading-[1.5] text-[#71606A]"
  >
    <physio-icon name="a-large-small" class="text-black" />
    Font Size
  </p>
  <div
    role="radiogroup"
    aria-labelledby="admin-font-size-label"
    class="grid grid-cols-3 gap-2"
  >
    <button
      *ngFor="let option of options"
      type="button"
      role="radio"
      [attr.aria-checked]="config().fontSize === option.value"
      [disabled]="saving()"
      [ngClass]="{
        'flex flex-col items-center gap-0.5 rounded-[6px] border py-2 px-1 cursor-pointer transition-colors disabled:cursor-wait': true,
        'border-primary bg-primary text-white': config().fontSize === option.value,
        'border-borderGray hover:bg-gray-100': config().fontSize !== option.value
      }"
      (click)="pick(option.value)"
    >
      <span class="font-medium leading-none" [style.font-size]="option.size">Aa</span>
      <span class="text-[12px] leading-[1.5]">{{ option.label }}</span>
    </button>
  </div>
</div>
